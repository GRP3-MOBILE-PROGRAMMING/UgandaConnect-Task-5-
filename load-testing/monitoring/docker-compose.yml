# Prometheus + Grafana (+ node_exporter) for UgandaConnect load tests, on Docker.
#
#   cd load-testing/monitoring
#   docker compose up -d
#
#   Prometheus  http://localhost:9090   (Status > Targets shows what is being scraped)
#   Grafana     http://localhost:3000   login admin / admin
#               Dashboards > UgandaConnect > "UgandaConnect - Load Test (live)"
#
# Prometheus scrapes the JMeter container that Jenkins starts (port 9270 on this machine)
# through host.docker.internal, so nothing needs editing when Jenkins runs on the same PC.
services:
  prometheus:
    image: prom/prometheus:v2.53.2
    container_name: uc-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle          # reload config: curl -X POST localhost:9090/-/reload
    ports: ["9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./load-test-alerts.yml:/etc/prometheus/load-test-alerts.yml:ro
      - prometheus-data:/prometheus
    extra_hosts: ["host.docker.internal:host-gateway"]   # needed on Linux; automatic on Docker Desktop
    restart: unless-stopped

  # Host metrics (CPU, memory, network) of this machine = the load generator
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: uc-node-exporter
    ports: ["9100:9100"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: uc-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["3000:3000"]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
