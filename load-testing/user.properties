# UgandaConnect load test - JMeter properties
# Pass with:  jmeter -n -t UgandaConnect_LoadTest.jmx -q user.properties ...

# ---------------------------------------------------------------- target ----
protocol=http
host=localhost
port=8080
base_path=/api/v1
data_dir=data

# ---------------------------------------------------------------- workload --
# total_users is split across personas by the mix_* percentages (must sum to 100)
total_users=100
mix_solar=15
mix_health=20
mix_uneb=30
mix_bills=25
mix_kcca=10
# Ramp-up (seconds) to reach total_users gradually, then hold for steady (seconds)
rampup=120
steady=600
# Think time between user actions (Gaussian: mean +/- deviation, ms)
think_time_ms=3000
think_dev_ms=1000
payment_poll_ms=2000

# ---------------------------------------------------------------- SLAs (ms) -
# Any single response slower than this is counted as a failed sample
sla_auth_ms=1500
sla_read_ms=2000
sla_write_ms=3000
connect_timeout_ms=5000
response_timeout_ms=30000

# ---------------------------------------------------------------- results ---
# Save what the HTML dashboard and check_sla.py need: per-sample label, time,
# status code, success flag, assertion messages, thread counts, latency, bytes.
jmeter.save.saveservice.output_format=csv
jmeter.save.saveservice.timestamp_format=ms
jmeter.save.saveservice.label=true
jmeter.save.saveservice.response_code=true
jmeter.save.saveservice.response_message=true
jmeter.save.saveservice.successful=true
jmeter.save.saveservice.thread_name=true
jmeter.save.saveservice.time=true
jmeter.save.saveservice.latency=true
jmeter.save.saveservice.connect_time=true
jmeter.save.saveservice.bytes=true
jmeter.save.saveservice.sent_bytes=true
jmeter.save.saveservice.thread_counts=true
jmeter.save.saveservice.idle_time=true
jmeter.save.saveservice.url=true
jmeter.save.saveservice.hostname=true
jmeter.save.saveservice.assertion_results_failure_message=true
jmeter.save.saveservice.response_data.on_error=false

# Percentiles shown in Aggregate Report and the HTML dashboard: p90, p95, p99
aggregate_rpt_pct1=90
aggregate_rpt_pct2=95
aggregate_rpt_pct3=99

# ---------------------------------------------------------------- HTML report
jmeter.reportgenerator.report_title=UgandaConnect - National Launch Load Test
jmeter.reportgenerator.overall_granularity=60000
# APDEX: satisfied <= 1 s, tolerated <= 3 s
jmeter.reportgenerator.apdex_satisfied_threshold=1000
jmeter.reportgenerator.apdex_tolerated_threshold=3000
# Exclude the setUp pre-flight check from the report statistics
jmeter.reportgenerator.exporter.html.series_filter=^(?!GET /status).*$
jmeter.reportgenerator.sample_filter=^(?!GET /status).*$

# Console progress line every 30 s (throughput, avg, errors, active threads)
summariser.name=summary
summariser.interval=30
summariser.out=true

# ---------------------------------------------------------------- Prometheus -
# Prometheus Listener (jmeter-prometheus-plugin) serves live metrics at :9270/metrics.
# 0.0.0.0 so Prometheus can scrape it from outside the container / host.
prometheus.ip=0.0.0.0
prometheus.port=9270
# Keep /metrics up 60 s after the test ends so Prometheus scrapes the final numbers
prometheus.delay=60
# Also export JMeter's own JVM metrics and active-thread (virtual user) counts
prometheus.save.jvm=true
prometheus.save.threads=true
prometheus.save.threads.name=jmeter_threads

# ---------------------------------------------------------------- HTTP ------
# Each iteration is a new app session: drop pooled connections between iterations
httpclient.reset_state_on_thread_group_iteration=true
httpclient4.retrycount=0
httpclient4.time_to_live=60000
CookieManager.save.cookies=false
